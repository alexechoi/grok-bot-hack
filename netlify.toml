"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"
  # Explicitly exclude local credentials from native function file tracing.
  included_files = ["!.caretakr/**", "!**/.caretakr/**", "!.env*", "!**/.env*", "!.git/**", "!.agents/**", "!.codex/**", "!.concord/**", "!.impeccable/**"]
